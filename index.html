// ─── PARSER ────────────────────────────────────────────────────────────────────
const PAID_STATUSES = ["pago","entregue","concluido"];
const CAT_COLORS = ["#6366f1","#8b5cf6","#0ea5e9","#10b981","#f59e0b","#f472b6","#ef4444","#94a3b8"];

function parseOrders(rows) {
  const orders = rows
    .map(r => ({
      business:(r.business_name||"").trim(),
      date:(r.created_at||"").split("T")[0],
      price:parseFloat(r.price)||0,
      status:(r.status||"").trim().toLowerCase(),
      title:(r.title||"").trim(),
      category:(r.category||"Outros").trim(),
    }))
    .filter(o => o.date);

  if (orders.length===0) return FALLBACK;

  const paid     = orders.filter(o => PAID_STATUSES.includes(o.status));
  const expired  = orders.filter(o => o.status==="expired");
  const canceled = orders.filter(o => ["cancelado","rejeitado"].includes(o.status));
  const totalRevenue = paid.reduce((s,o)=>s+o.price,0);
  const avgTicket = paid.length>0 ? Math.round(totalRevenue/paid.length) : 0;
  const convRate  = orders.length>0 ? Math.round((paid.length/orders.length)*100) : 0;

  // Daily
  const dayMap={};
  orders.forEach(o=>{
    const [y,m,d]=o.date.split("-");
    const key=`${d}/${m}`;
    if(!dayMap[key]) dayMap[key]={date:key,receita:0,pedidos:0,_s:parseInt(m)*100+parseInt(d)};
    if(PAID_STATUSES.includes(o.status)) dayMap[key].receita+=o.price;
    dayMap[key].pedidos++;
  });
  const daily=Object.values(dayMap).sort((a,b)=>a._s-b._s).map(({_s,...r})=>({...r,receita:Math.round(r.receita)}));

  // Weekly
  const weekMap={};
  orders.forEach(o=>{
    const d=new Date(o.date);
    const s=new Date(d);
    s.setDate(d.getDate()-((d.getDay()+6)%7));
    const wk=s.toISOString().split("T")[0];
    if(!weekMap[wk]) weekMap[wk]={receita:0,_d:s};
    if(PAID_STATUSES.includes(o.status)) weekMap[wk].receita+=o.price;
  });
  const weekly=Object.keys(weekMap).sort().map(wk=>{
    const d=weekMap[wk]._d;
    const mon=d.toLocaleString("pt-BR",{month:"short"}).replace(".","");
    return {semana:`S${Math.ceil(d.getDate()/7)} ${mon.charAt(0).toUpperCase()+mon.slice(1)}`,receita:Math.round(weekMap[wk].receita)};
  });

  // Parceiros
  const parcMap={};
  paid.forEach(o=>{
    if(!parcMap[o.business]) parcMap[o.business]={nome:o.business,receita:0,pedidos:0};
    parcMap[o.business].receita+=o.price;
    parcMap[o.business].pedidos++;
  });
  const parceiros=Object.values(parcMap).sort((a,b)=>b.receita-a.receita)
    .map(p=>({...p,receita:Math.round(p.receita),share:totalRevenue>0?Math.round(p.receita/totalRevenue*1000)/10:0}));

  // Categorias
  const catMap={};
  paid.forEach(o=>{
    if(!catMap[o.category]) catMap[o.category]=0;
    catMap[o.category]+=o.price;
  });
  const categorias=Object.entries(catMap).sort(([,a],[,b])=>b-a)
    .map(([name,value],i)=>({name,value:Math.round(value),color:CAT_COLORS[i%CAT_COLORS.length]}));

  // Produtos
  const prodMap={};
  orders.forEach(o=>{
    if(!o.title) return;
    if(!prodMap[o.title]) prodMap[o.title]={titulo:o.title,receita:0,pedidos_pagos:0,pedidos_total:0,ticket:0,categoria:o.category,parceiro:o.business};
    prodMap[o.title].pedidos_total++;
    if(PAID_STATUSES.includes(o.status)){prodMap[o.title].pedidos_pagos++;prodMap[o.title].receita+=o.price;}
  });
  const todosProdutos=Object.values(prodMap).sort((a,b)=>b.receita-a.receita)
    .map(p=>({...p,receita:Math.round(p.receita),ticket:p.pedidos_pagos>0?Math.round(p.receita/p.pedidos_pagos):0}));
  const topProdutos=todosProdutos.filter(p=>p.receita>0).slice(0,8)
    .map(p=>({titulo:p.titulo,receita:p.receita,pedidos:p.pedidos_pagos,ticket:p.ticket}));

  const statusData=[
    {name:"Pagos/Entregues",value:paid.length,color:"#10b981"},
    {name:"Expirados",value:expired.length,color:"#f59e0b"},
    {name:"Cancelados",value:canceled.length,color:"#ef4444"},
  ];
  const tot=orders.length;
  const funil=[
    {label:"Pedidos Iniciados",valor:tot,pct:100,color:"bg-indigo-500"},
    {label:"Pagamentos Gerados",valor:tot,pct:100,color:"bg-indigo-400"},
    {label:"Pagos / Entregues",valor:paid.length,pct:Math.round(paid.length/tot*100),color:"bg-emerald-500"},
    {label:"Expirados s/ Pagar",valor:expired.length,pct:Math.round(expired.length/tot*100),color:"bg-amber-400"},
    {label:"Cancelados",valor:canceled.length,pct:Math.round(canceled.length/tot*100),color:"bg-red-400"},
  ];
  const dates=orders.map(o=>o.date).filter(Boolean).sort();
  const fmtD=iso=>new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});

  return {
    daily,weekly,parceiros,categorias,topProdutos,todosProdutos,statusData,funil,
    kpis:{totalRevenue:Math.round(totalRevenue),paidCount:paid.length,expiredCount:expired.length,canceledCount:canceled.length,avgTicket,convRate,estimatedLoss:Math.round(expired.length*avgTicket),totalOrders:orders.length,startDate:dates[0]?fmtD(dates[0]):"",endDate:dates[dates.length-1]?fmtD(dates[dates.length-1]):""},
  };
}

// ─── HOOK ─────────────────────────────────────────────────────────────────────
function useOrdersSheet() {
  const [data,setData]=useState(FALLBACK);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [lastUpdated,setLastUpdated]=useState(null);
  const [isLive,setIsLive]=useState(false);

  const refetch=useCallback(()=>{
    if(!SHEET_ID) return;
    setLoading(true);setError(null);
    fetch(sheetUrl())
      .then(r=>{if(!r.ok) throw new Error(`HTTP ${r.status}`);return r.text();})
      .then(csv=>{
        const parsed=Papa.parse(csv,{header:true,skipEmptyLines:true});
        if(parsed.data.length>0){setData(parseOrders(parsed.data));setIsLive(true);setLastUpdated(new Date());}
      })
      .catch(e=>setError(e.message))
      .finally(()=>setLoading(false));
  },[]);

  useEffect(()=>{refetch();},[refetch]);
  return {data,loading,error,refetch,lastUpdated,isLive};
}

            <XAxis dataKey="date" tick={{fontSize:11}}/>
            <YAxis tick={{fontSize:11}} tickFormatter={v=>metric==="receita"?`R$${v}`:v}/>
            <Tooltip content={<CustomTooltip/>}/>
            <Area type="monotone" dataKey={metric} name={metric} stroke={C.indigo} fill="url(#gradR)" strokeWidth={2.5}/>
          </AreaChart>
        </ResponsiveContainer>
      </div>
      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <div className="bg-white rounded-2xl p-5 shadow-sm">
          <SecTitle>🥧 Distribuição de Status</SecTitle>
          <div className="flex items-center gap-6">
            <ResponsiveContainer width={160} height={160}>
              <PieChart>
                <Pie data={statusData} cx="50%" cy="50%" innerRadius={45} outerRadius={70} dataKey="value" paddingAngle={3}>
                  {statusData.map((e,i)=><Cell key={i} fill={e.color}/>)}
                </Pie>
              </PieChart>
            </ResponsiveContainer>
            <div className="flex flex-col gap-3 flex-1">
              {statusData.map((s,i)=>(
                <div key={i} className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full" style={{background:s.color}}/>
                    <span className="text-xs text-gray-500">{s.name}</span>
                  </div>
                  <div className="text-right">
                    <span className="text-sm font-bold text-gray-800">{s.value}</span>
                    <span className="text-xs text-gray-400 ml-1">({Math.round(s.value/kpis.totalOrders*100)}%)</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="bg-white rounded-2xl p-5 shadow-sm">
          <SecTitle>🏢 Parceiros — Share de Receita</SecTitle>
          <div className="space-y-3">
            {parceiros.slice(0,4).map((p,i)=>(
              <div key={i}>
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-gray-600 font-medium truncate max-w-[180px]">{p.nome}</span>
                  <span className="text-gray-800 font-bold">{fmt(p.receita)}</span>
                </div>
                <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full rounded-full" style={{width:`${p.share}%`,background:i===0?C.indigo:i===1?C.violet:C.sky}}/>
                </div>
                <p className="text-xs text-gray-400 mt-0.5">{p.pedidos} pedidos · {p.share}% do GMV</p>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── RECEITA ──────────────────────────────────────────────────────────────────
function TabReceita({data}){
  const {weekly,parceiros,categorias}=data;
  const maxWeek=weekly.reduce((a,b)=>b.receita>a.receita?b:a,weekly[0]||{});
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl p-5 shadow-sm">
        <SecTitle>📅 Receita por Semana (R$)</SecTitle>
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={weekly} barSize={44}>
            <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
            <XAxis dataKey="semana" tick={{fontSize:12}}/>
            <YAxis tick={{fontSize:12}} tickFormatter={v=>`R$${(v/1000).toFixed(0)}k`}/>
            <Tooltip content={<CustomTooltip/>}/>
            <Bar dataKey="receita" name="receita" radius={[6,6,0,0]}>
              {weekly.map((w,i)=><Cell key={i} fill={w.semana===maxWeek.semana?C.indigo:"#c7d2fe"}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
        {maxWeek.semana&&<p className="text-xs text-gray-400 mt-2 text-center">📌 Melhor semana: <span className="text-indigo-600 font-semibold">{maxWeek.semana} — {fmt(maxWeek.receita)}</span></p>}
      </div>
      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <div className="bg-white rounded-2xl p-5 shadow-sm">
          <SecTitle>🏢 Receita por Parceiro</SecTitle>
          <div className="space-y-4">
            {parceiros.map((p,i)=>(
              <div key={i}>
                <div className="flex justify-between items-center mb-1">
                  <span className="text-sm text-gray-700 font-medium truncate max-w-[200px]">{p.nome}</span>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-gray-400">{p.pedidos} pedidos</span>
                    <span className="text-sm font-bold text-gray-800">{fmt(p.receita)}</span>
                  </div>
                </div>
                <div className="h-2.5 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full rounded-full" style={{width:`${p.share}%`,background:[C.indigo,C.violet,C.sky,C.emerald,C.amber,"#f472b6"][i]||C.indigo}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="bg-white rounded-2xl p-5 shadow-sm">
          <SecTitle>🗂️ Receita por Categoria</SecTitle>
          <ResponsiveContainer width="100%" height={200}>
            <PieChart>
              <Pie data={categorias} cx="50%" cy="50%" outerRadius={80} dataKey="value" label={({percent})=>`${(percent*100).toFixed(0)}%`} labelLine={false}>
                {categorias.map((e,i)=><Cell key={i} fill={e.color}/>)}
              </Pie>
              <Tooltip formatter={v=>fmt(v)}/>
            </PieChart>
          </ResponsiveContainer>
          <div className="flex flex-wrap gap-x-4 gap-y-1.5 mt-2">
            {categorias.map((c,i)=>(
              <div key={i} className="flex items-center gap-1.5 text-xs">
                <div className="w-2.5 h-2.5 rounded-full" style={{background:c.color}}/>
                <span className="text-gray-500">{c.name}</span>
                <span className="text-gray-700 font-semibold">{fmt(c.value)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── PRODUTOS ─────────────────────────────────────────────────────────────────
function TabProdutos({data}){
  const {topProdutos}=data;
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl p-5 shadow-sm">
        <SecTitle>🏆 Top Produtos por Receita</SecTitle>
        <ResponsiveContainer width="100%" height={280}>
          <BarChart data={topProdutos} layout="vertical" barSize={16}>
            <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" horizontal={false}/>
            <XAxis type="number" tick={{fontSize:11}} tickFormatter={v=>`R$${v}`}/>
            <YAxis type="category" dataKey="titulo" tick={{fontSize:10,fill:"#6b7280"}} width={220}/>
            <Tooltip formatter={v=>fmt(v)}/>
            <Bar dataKey="receita" name="Receita" radius={[0,6,6,0]}>
              {topProdutos.map((_,i)=><Cell key={i} fill={i===0?C.indigo:i===1?C.violet:"#c7d2fe"}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="bg-white rounded-2xl p-5 shadow-sm">
        <SecTitle>📋 Detalhamento</SecTitle>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-gray-100">
                {["#","Produto","Receita","Pedidos","Ticket Médio"].map(h=><th key={h} className="text-left text-xs text-gray-400 font-semibold uppercase tracking-wide px-3 py-2">{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {topProdutos.map((p,i)=>(
                <tr key={i} className="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                  <td className="px-3 py-3 text-indigo-600 font-bold">#{i+1}</td>
                  <td className="px-3 py-3 text-gray-800 font-medium">{p.titulo}</td>
                  <td className="px-3 py-3 text-emerald-600 font-bold">{fmt(p.receita)}</td>
                  <td className="px-3 py-3 text-gray-500">{p.pedidos}</td>
                  <td className="px-3 py-3 text-amber-600 font-semibold">{fmt(p.ticket)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── LISTA PRODUTOS ───────────────────────────────────────────────────────────
function TabListaProdutos({data}){
  const {todosProdutos}=data;
  const [busca,setBusca]=useState("");
  const [catFiltro,setCatFiltro]=useState("Todas");
  const [ordenar,setOrdenar]=useState("receita");
  const categorias=["Todas",...Array.from(new Set(todosProdutos.map(p=>p.categoria)))];
  const filtered=todosProdutos
    .filter(p=>catFiltro==="Todas"||p.categoria===catFiltro)
    .filter(p=>p.titulo.toLowerCase().includes(busca.toLowerCase())||p.parceiro.toLowerCase().includes(busca.toLowerCase()))
    .sort((a,b)=>b[ordenar]-a[ordenar]);
  const catColor=c=>({Aniversário:"purple",Bares:"blue",Restaurantes:"green",Dates:"rose","Rolêzinho Econômico":"yellow","Vida Noturna":"gray"})[c]||"gray";
  const convPct=p=>p.pedidos_total>0?Math.round((p.pedidos_pagos/p.pedidos_total)*100):0;
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl p-4 shadow-sm flex flex-wrap items-center gap-3">
        <input type="text" placeholder="🔍 Buscar produto ou parceiro..." value={busca} onChange={e=>setBusca(e.target.value)} className="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 w-64"/>
        <div className="flex gap-1 flex-wrap">
          {categorias.map(c=>(
            <button key={c} onClick={()=>setCatFiltro(c)} className={`text-xs px-3 py-1.5 rounded-lg font-medium transition-colors ${catFiltro===c?"bg-indigo-600 text-white":"bg-gray-100 text-gray-500 hover:bg-gray-200"}`}>{c}</button>
          ))}
        </div>
        <div className="ml-auto flex items-center gap-2">
          <span className="text-xs text-gray-400">Ordenar:</span>
          {[["receita","Receita"],["pedidos_pagos","Pagos"],["pedidos_total","Total"]].map(([k,l])=>(
            <button key={k} onClick={()=>setOrdenar(k)} className={`text-xs px-3 py-1.5 rounded-lg font-medium transition-colors ${ordenar===k?"bg-gray-800 text-white":"bg-gray-100 text-gray-500 hover:bg-gray-200"}`}>{l}</button>
          ))}
        </div>
      </div>
      <div className="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <SecTitle>📦 {filtered.length} produto{filtered.length!==1?"s":""} encontrado{filtered.length!==1?"s":""}</SecTitle>
          <span className="text-xs text-gray-400">Receita filtrada: <span className="font-bold text-indigo-600">{fmt(filtered.reduce((s,p)=>s+p.receita,0))}</span></span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-gray-50">
              <tr>
                {["#","Produto","Parceiro","Categoria","Receita","Pagos","Total","Conversão","Ticket"].map(h=><th key={h} className="text-left text-xs text-gray-400 font-semibold uppercase tracking-wide px-4 py-3">{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {filtered.map((p,i)=>(
                <tr key={i} className="border-t border-gray-50 hover:bg-gray-50 transition-colors">
                  <td className="px-4 py-3 text-indigo-500 font-bold text-xs">{i+1}</td>
                  <td className="px-4 py-3 text-gray-800 font-medium max-w-xs"><span className="line-clamp-2 leading-snug">{p.titulo}</span></td>
                  <td className="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">{p.parceiro}</td>
                  <td className="px-4 py-3"><Badge label={p.categoria} color={catColor(p.categoria)}/></td>
                  <td className="px-4 py-3"><span className={`font-bold ${p.receita>0?"text-emerald-600":"text-gray-300"}`}>{p.receita>0?fmt(p.receita):"—"}</span></td>
                  <td className="px-4 py-3"><span className={`font-semibold ${p.pedidos_pagos>0?"text-gray-800":"text-gray-300"}`}>{p.pedidos_pagos}</span></td>
                  <td className="px-4 py-3 text-gray-500">{p.pedidos_total}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center gap-2">
                      <div className="w-14 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full ${convPct(p)>=60?"bg-emerald-400":convPct(p)>=30?"bg-amber-400":"bg-red-300"}`} style={{width:`${convPct(p)}%`}}/>
                      </div>
                      <span className="text-xs text-gray-500">{convPct(p)}%</span>
                    </div>
                  </td>
                  <td className="px-4 py-3"><span className={p.ticket>0?"text-amber-600 font-semibold":"text-gray-300"}>{p.ticket>0?fmt(p.ticket):"—"}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── FUNIL ────────────────────────────────────────────────────────────────────
function TabFunil({data}){
  const {funil,kpis,parceiros,categorias}=data;
  const topParceiro=parceiros[0]||{};
  const topCat=categorias[0]||{};
  const topCatPct=kpis.totalRevenue>0?Math.round(topCat.value/kpis.totalRevenue*100):0;
  const topParcPct=kpis.totalRevenue>0?Math.round((topParceiro.receita||0)/kpis.totalRevenue*100):0;
  return (
    <div className="space-y-5">
      <div className="bg-white rounded-2xl p-5 shadow-sm">
        <SecTitle>🔄 Funil de Conversão</SecTitle>
        <div className="space-y-3 max-w-xl mx-auto">
          {funil.map((f,i)=>(
            <div key={i} className="flex items-center gap-4">
              <span className="text-xs text-gray-400 w-40 text-right shrink-0">{f.label}</span>
              <div className="flex-1 bg-gray-100 rounded-full h-9 overflow-hidden">
                <div className={`h-full ${f.color} rounded-full flex items-center pl-4`} style={{width:`${f.pct}%`}}>
                  <span className="text-white text-sm font-bold">{f.valor}</span>
                </div>
              </div>
              <span className="text-xs text-gray-400 w-8 shrink-0">{f.pct}%</span>
            </div>
          ))}
        </div>
      </div>
      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 flex items-center justify-between gap-4">
        <div>
          <p className="text-sm font-bold text-amber-700 mb-1">⚠️ Receita potencial perdida por expiração</p>
          <p className="text-xs text-amber-600">{kpis.expiredCount} pedidos expiraram sem pagamento com ticket médio de {fmt(kpis.avgTicket)}. Um lembrete automático via WhatsApp nos primeiros 15 min pode recuperar grande parte disso.</p>
        </div>
        <div className="text-right shrink-0">
          <p className="text-2xl font-black text-amber-600">{fmt(kpis.estimatedLoss)}</p>
          <p className="text-xs text-amber-400">estimativa de perda</p>
        </div>
      </div>
      <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <div className="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-amber-400">
          <p className="text-2xl mb-2">⏱️</p>
          <p className="text-sm font-bold text-gray-700 mb-1">{Math.round(kpis.expiredCount/kpis.totalOrders*100)}% expiram sem pagar</p>
          <p className="text-xs text-gray-500 leading-relaxed">Considere aumentar o prazo de expiração ou enviar um lembrete de pagamento automático.</p>
        </div>
        <div className="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-indigo-400">
          <p className="text-2xl mb-2">🎂</p>
          <p className="text-sm font-bold text-gray-700 mb-1">{topCat.name} = {topCatPct}% da receita</p>
          <p className="text-xs text-gray-500 leading-relaxed">{topCat.name} gerou {fmt(topCat.value||0)} — {topCatPct}% da receita total. Vale criar campanhas sazonais para essa categoria.</p>
        </div>
        <div className="bg-white rounded-2xl p-5 shadow-sm border-l-4 border-emerald-400">
          <p className="text-2xl mb-2">🏆</p>
          <p className="text-sm font-bold text-gray-700 mb-1">1 parceiro = {topParcPct}% do GMV</p>
          <p className="text-xs text-gray-500 leading-relaxed">{topParceiro.nome} concentra {fmt(topParceiro.receita||0)}. Diversificar parceiros reduz risco e abre espaço para crescimento.</p>
        </div>
      </div>
      <div className="bg-white rounded-2xl p-5 shadow-sm">
        <SecTitle>📌 Resumo do Período ({kpis.startDate} – {kpis.endDate} 2026)</SecTitle>
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
          {[
            {label:"GMV Gerado",value:fmt(kpis.totalRevenue),color:"text-indigo-600"},
            {label:"Conversão",value:`${kpis.convRate}%`,color:"text-emerald-600"},
            {label:"Ticket Médio",value:fmt(kpis.avgTicket),color:"text-violet-600"},
            {label:"Top Parceiro",value:(topParceiro.nome||"—").split(" ").slice(0,2).join(" "),color:"text-amber-600"},
          ].map((s,i)=>(
            <div key={i} className="bg-gray-50 rounded-xl p-4 text-center">
              <p className={`text-lg font-black ${s.color}`}>{s.value}</p>
              <p className="text-xs text-gray-400 mt-0.5">{s.label}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN ─────────────────────────────────────────────────────────────────────
function OrdersDashboard(){
  const [activeTab,setActiveTab]=useState("overview");
  const {data,loading,error,refetch,lastUpdated,isLive}=useOrdersSheet();
  const {kpis}=data;

  const tabComponents={
    overview:<TabOverview data={data}/>,
    receita:<TabReceita data={data}/>,
    produtos:<TabProdutos data={data}/>,
    lista:<TabListaProdutos data={data}/>,
    funil:<TabFunil data={data}/>,
  };

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Header */}
      <div className="bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between shadow-sm">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-lg font-bold shadow">🗺️</div>
          <div>
            <p className="text-base font-bold text-gray-800">Where2Go</p>
            <p className="text-xs text-gray-400">Dashboard de Vendas · Pedidos</p>
          </div>
        </div>
        <div className="flex items-center gap-2 flex-wrap justify-end">
          {isLive?(
            <span className="text-xs bg-emerald-50 text-emerald-600 font-semibold px-3 py-1.5 rounded-lg border border-emerald-100">🟢 Google Sheets ao vivo</span>
          ):SHEET_ID?(
            <span className="text-xs bg-amber-50 text-amber-600 font-semibold px-3 py-1.5 rounded-lg border border-amber-100">⏳ Carregando…</span>
          ):(
            <span className="text-xs bg-gray-100 text-gray-400 font-semibold px-3 py-1.5 rounded-lg border border-gray-200">📋 Dados estáticos</span>
          )}
          <span className="text-xs bg-indigo-50 text-indigo-600 font-semibold px-3 py-1.5 rounded-lg border border-indigo-100">📅 {kpis.startDate} – {kpis.endDate} 2026</span>
          <span className="text-xs bg-emerald-50 text-emerald-600 font-semibold px-3 py-1.5 rounded-lg border border-emerald-100">✅ {kpis.totalOrders} pedidos · {fmt(kpis.totalRevenue)}</span>
          {isLive&&(
            <button onClick={refetch} disabled={loading} className="text-xs bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 font-medium px-3 py-1.5 rounded-lg transition-colors disabled:opacity-50">
              {loading?"↻ Atualizando…":"↻ Atualizar"}
            </button>
          )}
        </div>
      </div>

      {/* Error */}
      {error&&<div className="bg-red-50 border-b border-red-200 px-6 py-2 text-xs text-red-600">⚠️ Erro ao carregar do Sheets: {error}. Exibindo dados estáticos.</div>}

      {/* Tabs */}
      <div className="bg-white border-b border-gray-100 px-6">
        <div className="flex gap-1">
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`py-3 px-4 text-sm font-medium border-b-2 transition-colors ${activeTab===t.id?"border-indigo-600 text-indigo-600":"border-transparent text-gray-400 hover:text-gray-600"}`}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="px-6 py-6 max-w-7xl mx-auto">
        {loading&&!isLive?(
          <div className="flex items-center justify-center h-64 text-gray-400 text-sm gap-2">
            <span className="animate-spin">↻</span> Carregando dados do Google Sheets…
          </div>
        ):tabComponents[activeTab]}
      </div>

      {lastUpdated&&(
        <div className="px-6 pb-4 text-center text-xs text-gray-300">
          Última atualização: {lastUpdated.toLocaleTimeString("pt-BR")}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<OrdersDashboard/>);
</script>
</body>
</html>
